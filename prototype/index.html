function createTask(){let name=$('#taskName').value.trim(),goal=$('#taskGoal').value.trim();if(!name||!goal){toast('请填写任务名称和运营目标');return}closeModal();navigate('collab');$('#new-messages').innerHTML=msg('陈华凯','凯','刚刚','新任务：'+esc(name)+'。'+esc(goal))+msg('私域数字员工',icon('users-round'),'刚刚','已记录新协作需求（演示）。下一步将确认活动资料，分别安排私域触达与抖音内容工作。');icons();$('#feed').scrollTop=$('#feed').scrollHeight;toast('已创建演示协作需求')}
function createDraft(){if(!$('#sendGoal').value.trim()){toast('请先填写运营需求');return}let goal=$('#sendGoal').value,kind=$('#sendType').value;modal('<h2 id="modal-title">触达草案已生成</h2><p>方式：'+esc(kind)+'</p><div class="feature-box"><p>'+esc(goal)+'</p><p>待补充：具体门店、人群条件、发送内容和时间。确认信息后，可进入任务验收。</p></div><div class="modal-footer"><button class="primary" onclick="closeModal();navigate(\'collab\')">查看协作流程</button></div>')}
function runQuery(){let q=$('#queryInput').value.trim();if(!q){toast('请输入要查询的问题');return}$('#queryResult').innerHTML='<div class="feature-box"><h3>查询结果（演示）</h3><p>'+esc(q)+'</p><p>口径：品牌 A 三家门店；本周 10 月 12—17 日；按新增会员去重统计。</p></div>'+metrics([['本周新增会员','682','较上周 +12.4%'],['触达人数','12,680','成功触达去重 · 示例'],['近 30 天未到店','2,386','会员召回人群 · 示例']])+ '<p class="empty-note">当前展示预设演示结果，未执行真实数据查询。</p>';toast('已展示预设数据示例')}
function generateVideo(){if(!$('#videoGoal').value.trim()){toast('请先填写视频需求');return}modal('<h2 id="modal-title">视频需求已整理</h2><p>'+esc($('#videoGoal').value)+'</p><p>时长：'+esc($('#duration').value)+'</p><div class="notice">演示流程：需求整理 → 脚本确认 → 成片制作 → 内容验收。当前可查看示例脚本。</div><div class="modal-footer"><button class="primary" onclick="videoDetail()">查看示例脚本</button></div>')}
function inspectLive(){if(!$('#liveUrl').value.trim()){toast('请填写直播链接或 room_id');return}modal('<h2 id="modal-title">巡检任务预览</h2><p>直播间：'+esc($('#liveUrl').value)+'</p><p>巡检维度：画面质量、商品吸引力、主播专业度、投流运营能力。</p><div class="notice">当前为演示环境，未连接真实直播间，未启动监控。</div>')}
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){let v=e.target.value.trim();if(!v)return;modal('<h2 id="modal-title">搜索结果</h2><p>关键词：'+esc(v)+'</p><p>以下为演示空间中可浏览的关联内容。</p><button class="nav" onclick="closeModal();navigate(\'collab\')">周末门店联合营销 →</button><button class="nav" onclick="viewArtifact()">周末会员召回 · 群发草案 →</button>')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&current==='collab'&&$('#prompt'))sendMessage()});render();
</script><script src="video-ui.js"></script></body></html>
