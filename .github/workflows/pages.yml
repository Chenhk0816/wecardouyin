name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify prototype
        run: |
          for script in prototype/*.js; do node --check "$script"; done
          node tests/private-flow.test.cjs
          node tests/douyin-flow.test.cjs
          node tests/douyin-ui-state.test.cjs
          node tests/douyin-capability-boundary.test.cjs
      - name: Prepare site
        run: |
          mkdir -p _site
          cp prototype/index.html prototype/*.js prototype/*.css _site/
          cp -R prototype/assets _site/assets
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
